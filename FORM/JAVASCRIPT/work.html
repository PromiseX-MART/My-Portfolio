<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="work.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="box-shadow: 0px 1px 4px 5px rgba(83, 80, 80, 0.72);">
        <h1 style="text-align: center;">Student Registration</h1>
        <form id="student-form">
            <input type="text" placeholder="ENTER YOUR NAME" id="student-name" required minlength="3">
            <input type="number" placeholder="ENTER YOUR AGE" id="student-age" required>
            <input type="text" list="class" placeholder="ENTER YOUR CLASS" id="student-class" required>
            <datalist id="class">
                <option value="Year 1"></option>
                <option value="Year 2"></option>
                <option value="Year 3"></option>
                <option value="Year 4"></option>
                <option value="Year 5"></option>
                <option value="Year 6"></option>
                <option value="Year 7"></option>
                <option value="Year 8"></option>
                <option value="Year 9"></option>
                <option value="Year 10"></option>
                <option value="Year 11"></option>
                <option value="Year 12"></option>
            </datalist>
            <select id="student-grade"required>
                <option value="">Choose your grade</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="F">F</option>
            </select>
            <button type="submit">ADD</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Student Name</th>
                    <th>Student Age</th>
                    <th>Student Class</th>
                    <th>Student Grade</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody id="student-data">

            </tbody>
            <div class="search-section">
                <input type="text" placeholder="Search" class="search-box">
                <button class="icon"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

        </table>
    </div>

    <!-- <div id="name-cont">
        <p>Hello <span id="name-holder"></span></p>
        <button id="name-btn">Show name</button>
    </div> -->
    
</body>
<script src="work.js"></script>

</html>
